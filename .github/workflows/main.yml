name: Release Standalone Binaries
on:
    push:
        tags:
            - 'v*' # Trigger on version tags

jobs:
    build:
        name: Build for ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      artifact_name: jsmuggle-linux
                    - os: windows-latest
                      artifact_name: jsmuggle-win.exe
                    - os: macos-latest
                      artifact_name: jsmuggle-macos

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js (v25.5+)
              uses: actions/setup-node@v4
              with:
                  node-version: '25.5.0'

            - name: Install & Bundle
              run: |
                  npm install
                  npm run build

            - name: Create SEA Binary
              run: |
                  # 1. Run the build-sea command
                  npm run build:sea
                  # 2. Rename the generic output to platform name
                  mv sea-prep.blob ${{ matrix.artifact_name }} 2>/dev/null || mv sea-prep.blob.exe ${{ matrix.artifact_name }}

            - name: Upload Binaries to Release
              uses: softprops/action-gh-release@v2
              with:
                  files: ${{ matrix.artifact_name }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
