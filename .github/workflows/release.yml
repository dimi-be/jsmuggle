name: Node.js Package

on:
    push:
        tags:
            - 'v*' # Trigger on version tags
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22 # Using Node 22 (LTS) for better stability

            - name: Install & Build
              run: |
                  npm install
                  npm run build
                  npm run test:run

            - name: Create GitHub Release
              # Pinning to v2.4.2 avoids the 2026 retry loop bug
              uses: softprops/action-gh-release@v2.4.2
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  files: dist/jsmuggle.cjs
                  generate_release_notes: true # Bonus: Auto-generates changelog
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
